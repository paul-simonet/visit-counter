<!doctype html>
<meta charset="utf-8">
<title>Visit counter</title>
<h1 id="out">Loading...</h1>
<script>
  const API = location.port === "8081" ? "http://localhost:8082" : "/api";
  fetch(API + "/visits")
    .then((r) => r.json())
    .then((d) => (out.textContent = `Visite sur cette page: ${d.visits}`))
    .catch(() => (out.textContent = "The API cannot be reached"));
</script>

services:
  site:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro

  api:
    build: ./api
    ports:
      - "8082:8082"
    environment:
      DB_HOST: db
    depends_on:
      - db

  db:
    image: redis:alpine
    command: redis-server --appendonly yes
    volumes:
      - counter-data:/data

volumes:
  counter-data:
